services:
  - type: web
    name: filmbymihaylov-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: KODIK_TOKEN
        sync: false
    autoDeploy: true
