# Сборка APK для Android и выкладка в Releases на GitHub.
#
# Запуск: вкладка Actions → Android APK → Run workflow (или сам собой после
# изменений приложения в main). Готовый файл — в Releases, последняя
# сборка помечена Latest: её можно скачать прямо с телефона.
#
# Подпись. Чтобы новая версия ставилась поверх старой, ключ должен быть
# всегда один. Он хранится в секретах репозитория (Settings → Secrets and
# variables → Actions):
#   ANDROID_KEYSTORE_BASE64 — файл .jks в base64
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Без них APK подписывается отладочным ключом сборщика — ставится, но
# каждую следующую версию придётся ставить через удаление старой.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flutter_app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Подпись постоянным ключом"
          else
            echo "::warning::Секретов подписи нет — APK подписан отладочным ключом"
          fi

      # Номер сборки растёт с каждым запуском: Android ставит обновление,
      # только если versionCode больше, чем у установленной версии.
      - name: Сборка APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Логи Actions видны только после входа на GitHub, а аннотации —
      # всем. При ошибке выносим хвост лога туда, чтобы причину было видно.
      - name: Причина ошибки
        if: failure()
        run: |
          grep -E "error|Error|FAILURE|What went wrong|Exception|>" "$RUNNER_TEMP/build.log" \
            | grep -v "^\s*$" | tail -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > "$RUNNER_TEMP/tail.txt" || true
          echo "::error title=flutter build apk::$(cat "$RUNNER_TEMP/tail.txt")"

      - name: Имя файла
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MonkeyApp-${{ github.run_number }}.apk"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Monkey App для Android — сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            APK для Android. Скачай файл ниже и открой его на телефоне
            (один раз понадобится разрешить установку из этого источника).

            Коммит: ${{ github.sha }}
          files: flutter_app/dist/MonkeyApp-${{ github.run_number }}.apk
