# Render на бесплатном тарифе засыпает через 15 минут без запросов, и первый
# запрос после сна ждёт сервер 30–60 секунд. Будильник раз в 10 минут не даёт
# ему уснуть. /ping не трогает базу, поэтому Neon спит спокойно и не тратит
# лимит вычислений. Репозиторий публичный — Actions для него бесплатны.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 \
            https://movie-app-xwuo.onrender.com/ping
