<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Monkey App · плеер</title>
<!--
  Страница для встроенного плеера приложения: /player/?u=<адрес плеера источника>.

  Источник открывается здесь в iframe — так же, как на главной странице сайта.
  Важно, что это тот же домен, что и у сайта: источники по-разному относятся
  к тому, откуда их встроили, и со страницы на сервере API отвечали
  «We couldn't find that», хотя с сайта тот же фильм играл.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { color: #aaa; font: 15px/1.5 system-ui, sans-serif; text-align: center; margin-top: 40vh; }
</style>
</head>
<body>
<script>
  // Только известные источники: страница не должна встраивать что угодно.
  function allowed(url) {
    try {
      var u = new URL(url);
      if (u.protocol !== "https:") return false;
      var host = u.hostname.toLowerCase();
      var site = host.split(".").slice(-2).join(".");
      if (site.indexOf("vidsrc") === 0) return true; // VidSrc часто меняет домен
      return ["videasy.net", "2embed.cc", "youtube.com", "youtube-nocookie.com"].some(function (r) {
        return host === r || host.slice(-(r.length + 1)) === "." + r;
      });
    } catch (e) {
      return false;
    }
  }

  var src = new URLSearchParams(location.search).get("u") || "";
  if (allowed(src)) {
    var frame = document.createElement("iframe");
    frame.src = src;
    frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; fullscreen; gyroscope; picture-in-picture";
    frame.allowFullscreen = true;
    document.body.appendChild(frame);
  } else {
    document.body.innerHTML = "<p>Не удалось открыть плеер: неизвестный источник.</p>";
  }
</script>
</body>
</html>
